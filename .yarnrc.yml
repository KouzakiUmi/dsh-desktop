enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Fast-moving Desktop dependencies may be consumed on their publication day.
npmMinimalAgeGate: 0

# The product ships Windows x64 only, so the physical node_modules tree carries
# that single target and no other platform's native payload.
supportedArchitectures:
  os:
    - win32
  cpu:
    - x64
